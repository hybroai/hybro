[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybro-backend"
version = "0.3.0"
description = "Hybro backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette>=2.3.6",
    "starlette>=0.46.2",
    "python-multipart>=0.0.20",
    # A2A protocol
    "a2a-sdk>=1.1.2,<2",
    # Database
    "motor>=3.7.1",
    "pymongo",
    "redis>=5.2.0",
    # AI / LLM
    "openai>=1.86.0",
    "tiktoken>=0.9.0",
    "pillow==12.2.0",
    "imagesize==2.0.1",
    # HTTP clients
    "aiohttp>=3.12.13",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.0",
    "requests>=2.32.4",
    # Auth
    "clerk-backend-api>=1.0.0",
    "jwcrypto>=1.5.6",
    "pyjwt>=2.8,<3",
    # Config / data validation
    "pydantic>=2.11.7",
    "pydantic-settings>=2.9.1",
    "jsonschema>=4.23.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2,<7",
    "platformdirs>=4.3.8",
    # Utilities
    "cachetools>=5.5.2",
    "python-dateutil>=2.9.0.post0",
    "pypdf>=5.0.0,<7",
    "gunicorn>=25.3.0",
]

[project.scripts]
hybro-backend = "main:main"

[project.optional-dependencies]
# The local MCP server (MCP/server.py) runs from this environment.
mcp = [
    "httpx>=0.28.1,<1",
    "mcp>=2.2.0,<3",
    "pydantic>=2.12,<3",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "--asyncio-mode=auto",
]
markers = [
    "asyncio: mark test as async",
    "core: critical local product-flow regression baseline",
    "integration: requires an explicitly configured external service",
    "functional: automated end-to-end functional regression tests (live service)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = 'py312'
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".mypy_cache",
    ".pytest_cache"
]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "C90"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Compatibility lint baseline. Global rules stay enabled so new files and newly
# introduced violations outside these exact files are still checked.
"a2a_adapter/artifact_storage.py" = ["C901"]
"tests/orchestrator_harness/conformance.py" = ["C901"]

"a2a_adapter/webhook_payloads.py" = ["C901"]
"agent/facade.py" = ["C901"]
"api_gateway/registry.py" = ["C901"]
"api_gateway/routes/agent_group_routes.py" = ["B008"]
"api_gateway/routes/agent_routes.py" = ["B008", "C901"]
"api_gateway/routes/files_routes.py" = ["B008"]
"api_gateway/routes/hitl_routes.py" = ["B008"]
"api_gateway/routes/inspection_routes.py" = ["B008"]
"api_gateway/routes/room_routes.py" = ["B008", "C901"]
"api_gateway/routes/sse_routes.py" = ["B008"]
"agent/health.py" = ["C901"]
"agent/service.py" = ["C901"]
"conversation/message_sending.py" = ["C901"]
"conversation/preflight.py" = ["C901"]
"common/a2a_constants.py" = ["UP042"]
"common/dto/execution.py" = ["UP042"]
"common/observability/tracing.py" = ["UP035"]
"common/types.py" = ["UP042"]
"common/utils/a2a_helpers.py" = ["C901"]
"common/utils/context_utils.py" = ["C901", "UP047"]
"context_memory/compaction.py" = ["C901"]
"delivery/translator.py" = ["C901"]
"approval/service.py" = ["C901"]
"execution/orchestrator/kernel.py" = ["C901"]
"execution/orchestrator/model_runtime.py" = ["C901"]
"execution/orchestrator/transcript.py" = ["C901"]
"llm_gateway/providers/openai_provider.py" = ["C901"]
"llm_gateway/structured_generation.py" = ["C901"]
"jobs/compaction_sweep.py" = ["C901"]
"jobs/stale_task_checker.py" = ["C901"]
"main.py" = ["B008", "C901"]
"models/agent.py" = ["UP042"]
"models/hitl.py" = ["UP042"]
"models/response.py" = ["UP046"]
"tests/test_api_thin_adapters.py" = ["C901"]
"tests/test_compaction_service.py" = ["C901"]
"tests/test_context_memory_repository.py" = ["C901"]
"tests/test_delivery_protocols.py" = ["C901"]
"tests/test_phase7a_processing_status_gate.py" = ["C901"]

[tool.ruff.format]
docstring-code-format = true

[tool.setuptools]
py-modules = ["main", "container", "runtime_entrypoint", "volume_migration"]
packages = [
    "agent",
    "approval",
    "approval.repository",
    "agent.repository",
    "chat",
    "conversation",
    "conversation.repository",
    "room_files",
    "session",
    "session.repository",
    "context_memory",
    "context_memory.repository",
    "dal",
    "dal.mongo",
    "dal.redis",
    "execution.repository.orchestrator",
    "delivery",
    "delivery.sse",
    "delivery.event_bus",
    "execution",
    "execution.adapters",
    "execution.orchestrator",
    "execution.orchestrator.a2a_runtime",
    "execution.repository",
    "local_agents",
    "api_gateway",
    "api_gateway.routes",
    "models",
    "common",
    "common.eventing",
    "common.config",
    "common.dto",
    "common.errors",
    "common.middleware",
    "common.observability",
    "common.protocols",
    "common.utils",
    "a2a_adapter",
    "llm_gateway",
    "llm_gateway.providers",
    "llm_gateway.services",
    "jobs",
    "scripts",
]

[tool.uv]
preview = true
