[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybro-backend"
version = "0.2.15"
description = "Hybro backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette>=2.3.6",
    "starlette>=0.46.2",
    # A2A protocol
    "a2a-sdk>=0.3.25,<1",
    # Database
    "motor>=3.7.1",
    "pymongo",
    "redis>=5.2.0",
    # AI / LLM
    "openai>=1.86.0",
    "tiktoken>=0.9.0",
    "mcp>=1.9.4",
    # HTTP clients
    "aiohttp>=3.12.13",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.0",
    "requests>=2.32.4",
    # Auth
    "clerk-backend-api>=1.0.0",
    "jwcrypto>=1.5.6",
    "pyjwt>=2.8,<3",
    # Config / data validation
    "pydantic>=2.11.7",
    "pydantic-settings>=2.9.1",
    "jsonschema>=4.23.0",
    "python-dotenv>=1.1.0",
    "platformdirs>=4.3.8",
    # Utilities
    "cachetools>=5.5.2",
    "python-dateutil>=2.9.0.post0",
    "pypdf>=5.0.0,<7",
    "gunicorn>=25.3.0",
]

[project.scripts]
hybro-backend = "main:main"
discover = "scripts.discovery_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "--asyncio-mode=auto",
]
markers = [
    "asyncio: mark test as async",
    "core: critical local product-flow regression baseline",
    "integration: requires an explicitly configured external service",
    "functional: automated end-to-end functional regression tests (live service)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = 'py312'
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".mypy_cache",
    ".pytest_cache"
]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "C90"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Compatibility lint baseline. Global rules stay enabled so new files and newly
# introduced violations outside these exact files are still checked.
"a2a_adapter/artifact_storage.py" = ["C901"]
"room/a2a_file_parts.py" = ["UP042"]
