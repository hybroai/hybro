# Generated from docker-compose.yml by default_agents/render_release.py.
# Do not edit by hand: edit docker-compose.yml and regenerate.
#
# Differences from the development stack:
#   - every service runs a published image instead of a local build
#   - image tags come from the hybro CLI that starts this stack
# Build arguments are absent, so a released stack never rebuilds anything.
name: hybro
services:
  mongo:
    image: mongo:7.0
    command:
    - --replSet
    - rs0
    - --bind_ip_all
    - --port
    - '27017'
    - --quiet
    ports:
    - 27017:27017
    volumes:
    - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  mongo-setup:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    command: "mongosh --host mongo:27017 --eval ' try {\n  rs.status();\n} catch(e) {\n  rs.initiate({ _id: \"rs0\", members: [ { _id: 0, host: \"mongo:27017\" } ] });\n}'\n"
  redis:
    image: redis:7.0-alpine
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    restart: always
  backend:
    ports:
    - 8000:8000
    environment:
    - HYBRO_CONTAINER=1
    - HYBRO_HOME=/var/lib/hybro/runtime
    - LOCAL_AGENT_DISCOVERY_EXCLUDED_PORTS=7001,6002,7002,7003
    volumes:
    - room_files:/var/lib/hybro/files
    - ${HYBRO_HOME:-${HOME}/.hybro}:/var/lib/hybro/runtime
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else sys.exit(1)
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: always
    image: ${HYBRO_IMAGE_REGISTRY:-ghcr.io/hybroai}/hybro-backend:${HYBRO_STACK_TAG:?the hybro CLI sets the stack version}
  mcp:
    ports:
    - 127.0.0.1:8001:8001
    environment:
    - HYBRO_MCP_CONFIG=${HYBRO_MCP_CONFIG:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - import json,urllib.request,sys; data=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4)); sys.exit(0 if data.get('status') == 'ready' else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    image: ${HYBRO_IMAGE_REGISTRY:-ghcr.io/hybroai}/hybro-mcp:${HYBRO_STACK_TAG:?the hybro CLI sets the stack version}
  frontend:
    ports:
    - 3000:3000
    environment:
    - HYBRO_BACKEND_URL=http://backend:8000
    - HYBRO_MCP_URL=http://mcp:8001
    - HYBRO_FRONTEND_CONFIG=${HYBRO_FRONTEND_CONFIG:-}
    - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
    - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET:-}
    depends_on:
    - backend
    restart: always
    image: ${HYBRO_IMAGE_REGISTRY:-ghcr.io/hybroai}/hybro-frontend:${HYBRO_STACK_TAG:?the hybro CLI sets the stack version}
  weather-agent:
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
    - SERVER_PORT=7001
    - SERVER_DOMAIN=weather-agent
    - HYBRO_AGENT_CONFIG=${HYBRO_AGENT_CONFIG:-}
    ports:
    - 7001:7001
    image: ${HYBRO_IMAGE_REGISTRY:-ghcr.io/hybroai}/hybro-weather-agent:${HYBRO_STACK_TAG:?the hybro CLI sets the stack version}
  image-generator-agent:
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
    - SERVER_PORT=6002
    - SERVER_DOMAIN=image-generator-agent
    - HYBRO_AGENT_CONFIG=${HYBRO_AGENT_CONFIG:-}
    ports:
    - 6002:6002
    image: ${HYBRO_IMAGE_REGISTRY:-ghcr.io/hybroai}/hybro-image-generator-agent:${HYBRO_STACK_TAG:?the hybro CLI sets the stack version}
  travel-planner-agent:
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
    - SERVER_PORT=7002
    - SERVER_DOMAIN=travel-planner-agent
    - HYBRO_AGENT_CONFIG=${HYBRO_AGENT_CONFIG:-}
    ports:
    - 7002:7002
    image: ${HYBRO_IMAGE_REGISTRY:-ghcr.io/hybroai}/hybro-travel-planner-agent:${HYBRO_STACK_TAG:?the hybro CLI sets the stack version}
  story-agent:
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
    - SERVER_PORT=7003
    - SERVER_DOMAIN=story-agent
    - HYBRO_AGENT_CONFIG=${HYBRO_AGENT_CONFIG:-}
    ports:
    - 7003:7003
    image: ${HYBRO_IMAGE_REGISTRY:-ghcr.io/hybroai}/hybro-story-agent:${HYBRO_STACK_TAG:?the hybro CLI sets the stack version}
  registrar:
    environment:
    - BACKEND_URL=http://backend:8000
    - API_PREFIX=${HYBRO_API_PREFIX:-/api/v1}
    - AGENT_REGISTRAR_TOKEN=${AGENT_REGISTRAR_TOKEN:-}
    restart: 'no'
    depends_on:
      backend:
        condition: service_healthy
      weather-agent:
        condition: service_started
      image-generator-agent:
        condition: service_started
      travel-planner-agent:
        condition: service_started
      story-agent:
        condition: service_started
    image: ${HYBRO_IMAGE_REGISTRY:-ghcr.io/hybroai}/hybro-registrar:${HYBRO_STACK_TAG:?the hybro CLI sets the stack version}
volumes:
  mongo_data: null
  redis_data: null
  room_files: null
