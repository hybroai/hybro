name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:


jobs:
  backend-ci:
    name: Backend CI (Python / FastAPI)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HYBRO_TEST_REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "backend-uv"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run Core Backend Baseline
        run: uv run pytest -m core

      - name: Run Backend Unit Tests
        run: uv run pytest -m "not integration and not functional"


  default-agents-ci:
    name: Default Agents CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "default-agents-uv"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the agent manifest, workspace and image are in sync
        run: uv run --with pytest --with pyyaml python -m pytest default_agents/tests/test_manifest_in_sync.py

      # The sample agents share one workspace lock. Install their dependencies
      # only (the agents are never built as packages) and run the unit tests in
      # that environment. test_agents_e2e.py needs a live stack, so it is not here.
      - name: Install the agent workspace
        run: uv sync --project default_agents --frozen --all-packages --no-install-workspace

      - name: Run agent unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/default_agents
        run: >-
          uv run --project default_agents --frozen --no-sync --no-env-file
          python -m pytest --noconftest default_agents/tests
          --ignore default_agents/tests/test_agents_e2e.py

      # The default projection for `npm run dev` must match the backend schema.
      - name: Check the frontend dev projection is in sync
        working-directory: backend
        run: uv run --frozen --no-env-file python ../packaging/frontend/render_public_config.py --check


  frontend-ci:
    name: Frontend CI (Next.js / React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests with Vitest
        run: npm run test


  mcp-ci:
    name: MCP CI (local adapter)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "mcp-uv"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The MCP server runs from the backend environment with its `mcp` extra.
      - name: Install MCP dependencies
        run: uv sync --project backend --frozen --extra mcp --extra dev

      - name: Run MCP Tests
        run: uv run --project backend --frozen --extra mcp --extra dev --no-env-file pytest MCP/tests


  image-ci:
    name: Image CI (single image smoke test)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, default-agents-ci, mcp-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "image-uv"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the image
        run: docker build -t hybro:ci .

      # An empty config directory: no provider, so only Echo is active.
      - name: Start the image
        run: |
          CI_HOME="$RUNNER_TEMP/hybro-image"
          mkdir -p "$CI_HOME"
          chmod 700 "$CI_HOME"
          docker run -d --name hybro-image-ci \
            -p 127.0.0.1:8180:8080 \
            -e HYBRO_LISTEN=loopback -e HYBRO_PUBLIC_PORT=8180 \
            -v "$CI_HOME:/var/lib/hybro/runtime" -v hybro-image-ci-data:/data \
            --stop-timeout 60 hybro:ci

      - name: Smoke test through the one port
        run: >-
          uv run --project backend --frozen --extra mcp --no-env-file
          python scripts/image_smoke.py http://localhost:8180

      - name: Stop cleanly within the stop timeout
        run: |
          timeout 70s docker stop hybro-image-ci
          test "$(docker inspect -f '{{.State.ExitCode}}' hybro-image-ci)" = 0

      # UID 0 and an existing UID (the run above is the new-user case), and a
      # forced replica set reconfig from 0.3 data that names mongo:27017.
      - name: Entrypoint UID and replica set cases
        run: scripts/image_ci_cases.sh hybro:ci

      - name: Dump Container Logs on Failure
        if: failure()
        run: docker logs --tail=200 hybro-image-ci

      - name: Remove the container
        if: always()
        run: docker rm -f hybro-image-ci; docker volume rm -f hybro-image-ci-data


  cli-ci:
    name: Shell CLI CI (stubbed Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "cli-uv"

      # Ubuntu's /bin/sh is dash; busybox adds a third POSIX shell.
      - name: Install shellcheck and busybox
        run: sudo apt-get update && sudo apt-get install -y shellcheck busybox

      - name: Lint the shell CLI and install script
        run: shellcheck -s sh scripts/hybro install.sh

      # Stub docker, curl, and npm on PATH; every test runs under each shell.
      - name: Shell CLI and install script tests
        run: uv run --no-project --with pytest pytest scripts/test_hybro_cli.py -v

  migration-ci:
    name: Migration CI (0.3 volumes to the single image)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, default-agents-ci, mcp-ci, cli-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The checkout's CLI runs in dev mode and uses hybro:dev.
      - name: Build the image
        run: docker build -t hybro:dev .

      - name: Migrate 0.3-shaped fixture volumes with hybro upgrade
        run: scripts/migration_ci.sh


  functional-ci:
    name: Functional Regression CI (Single Image + Mock LLM)
    # Playwright 1.58 cannot install Chromium on Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    needs: [backend-ci, frontend-ci, default-agents-ci, mcp-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "functional-uv"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Backend Test Runner Dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      # The image is configured through JSON, so CI writes the CI runtime
      # directory it owns and starts the image through the checkout's CLI. The
      # mock LLM runs on the runner, reached through host.docker.internal.
      - name: Prepare CI Runtime Configuration
        run: |
          CI_HOME="$RUNNER_TEMP/hybro-ci"
          mkdir -p "$CI_HOME"
          chmod 700 "$CI_HOME"
          cat > "$CI_HOME/config.json" <<'JSON'
          {
            "version": 1,
            "provider": { "id": "openai", "auth": "api_key" },
            "models": { "text": "gpt-4o-mini", "image": "gpt-image-2.5-flare" },
            "backend": { "openai_base_url": "http://host.docker.internal:18080/v1" }
          }
          JSON
          cat > "$CI_HOME/auth.json" <<'JSON'
          {
            "provider": "openai",
            "auth": "api_key",
            "api_key": "mock-api-key-ci"
          }
          JSON
          chmod 600 "$CI_HOME/auth.json"
          echo "HYBRO_HOME=$CI_HOME" >> "$GITHUB_ENV"

      - name: Start the mock LLM server on the runner
        run: |
          nohup python scripts/mock_llm_server.py 18080 > "$RUNNER_TEMP/mock-llm.log" 2>&1 &
          timeout 30s bash -c 'until curl -s -o /dev/null http://127.0.0.1:18080/; do sleep 1; done'

      - name: Start Hybro from the checkout with the mock LLM
        env:
          HYBRO_NO_UPDATE_CHECK: "1"
        run: |
          ./scripts/hybro start -d --build
          echo "Waiting for backend health check..."
          timeout 180s bash -c 'until curl -sf http://localhost:3100/health; do sleep 2; done'
          echo "Waiting for agents registration..."
          timeout 90s bash -c 'until curl -sf "http://localhost:3100/api/v1/agent/getAllAgents?active_only=true" | grep -qi "Travel Planner"; do sleep 2; done'
          timeout 90s bash -c 'until curl -sf "http://localhost:3100/api/v1/agent/getAllAgents?active_only=true" | grep -qi "Image Generator"; do sleep 2; done'
          echo "Agents successfully registered!"

      - name: Verify default MCP startup and tools
        run: |
          uv run --project backend --frozen --extra mcp --no-env-file python - <<'PY'
          import asyncio
          import httpx
          from mcp import Client

          async def check():
              async with httpx.AsyncClient(timeout=5) as http:
                  panel = await http.get("http://localhost:3100/hybro-mcp")
                  assert panel.json() == {"service": "hybro-mcp", "status": "ready"}
              async with Client("http://localhost:3100/mcp") as client:
                  tools = await client.list_tools()
                  assert {tool.name for tool in tools.tools} == {
                      "list_subnets",
                      "find_agents",
                      "get_agent",
                      "discover_agents",
                      "send_message",
                      "check_session",
                      "close_session",
                  }
                  result = await client.call_tool("discover_agents", {})
                  assert not result.is_error
                  discovered = result.structured_content["agents"]
                  assert discovered
                  subnets = await client.call_tool("list_subnets", {})
                  assert not subnets.is_error
                  assert isinstance(subnets.structured_content["subnets"], list)
                  # Read-only checks: no agent is invoked.
                  target = discovered[0]
                  found = await client.call_tool(
                      "find_agents", {"query": target["agent_card"]["name"]}
                  )
                  assert not found.is_error
                  assert target["agent_id"] in {
                      agent["agent_id"] for agent in found.structured_content["agents"]
                  }
                  profile = await client.call_tool(
                      "get_agent", {"agent_id": target["agent_id"]}
                  )
                  assert not profile.is_error
                  assert "url" not in profile.structured_content

          asyncio.run(check())
          PY

      - name: Run Backend Functional Tests Against Live Containers
        working-directory: backend
        env:
          HYBRO_API_URL: http://localhost:3100/api/v1
          HYBRO_FORCE_FUNCTIONAL_TESTS: "1"
        run: uv run pytest tests/functional/ -v --tb=short

      - name: Run Frontend Playwright Functional E2E Against Live Containers
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3100/api/v1
          PLAYWRIGHT_BASE_URL: http://localhost:3100
        run: npx playwright test tests/e2e/functional-hitl-workflow.spec.ts tests/e2e/sessions.spec.ts

      - name: Dump Container and Mock LLM Logs on Failure
        if: failure()
        run: |
          docker logs --tail=200 hybro-dev
          tail -n 50 "$RUNNER_TEMP/mock-llm.log"

      - name: Remove the container and its volume
        if: always()
        run: docker rm -f hybro-dev; docker volume rm -f hybro-dev-data
