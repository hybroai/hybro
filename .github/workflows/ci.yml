name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:


jobs:
  backend-ci:
    name: Backend CI (Python / FastAPI)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HYBRO_TEST_REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "backend-uv"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run Core Backend Baseline
        run: uv run pytest -m core

      - name: Run Backend Unit Tests
        run: uv run pytest -m "not integration and not functional"


  default-agents-ci:
    name: Default Agents CI (compose sync)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "default-agents-uv"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # docker-compose.yml's default-agent region is generated from
      # default_agents/agents.yaml. Fail if the manifest was edited without
      # running: python default_agents/render_compose.py
      - name: Check docker-compose.yml is in sync with agents.yaml
        run: uv run --with pyyaml python default_agents/render_compose.py --check


  frontend-ci:
    name: Frontend CI (Next.js / React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.19
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests with Vitest
        run: npm run test


  functional-ci:
    name: Functional Regression CI (Docker Stack + Mock LLM)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, default-agents-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "functional-uv"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20.19
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Backend Test Runner Dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Start Full Hybro Container Stack with Mock LLM
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
          echo "Waiting for backend health check..."
          timeout 180s bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'
          echo "Backend container is healthy and ready!"
          echo "Waiting for agents registration..."
          timeout 90s bash -c 'until curl -sf http://localhost:8000/api/v1/agent/getAllAgents?active_only=true | grep -qi "Travel Planner"; do sleep 2; done'
          echo "Agents successfully registered!"

      - name: Run Backend Functional Tests Against Live Containers
        working-directory: backend
        env:
          HYBRO_API_URL: http://localhost:8000/api/v1
          HYBRO_FORCE_FUNCTIONAL_TESTS: "1"
        run: uv run pytest tests/functional/ -v --tb=short

      - name: Run Frontend Playwright Functional E2E Against Live Containers
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: npx playwright test tests/e2e/functional-hitl-workflow.spec.ts

      - name: Dump Container Logs on Failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=100

      - name: Tear Down Stack
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
