name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:


jobs:
  backend-ci:
    name: Backend CI (Python / FastAPI)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HYBRO_TEST_REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "backend-uv"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run Core Backend Baseline
        run: uv run pytest -m core

      - name: Run Backend Unit Tests
        run: uv run pytest -m "not integration and not functional"


  default-agents-ci:
    name: Default Agents CI (compose sync)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "default-agents-uv"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # docker-compose.yml's default-agent region is generated from
      # default_agents/agents.yaml. Fail if the manifest was edited without
      # running: python default_agents/render_compose.py
      - name: Check docker-compose.yml is in sync with agents.yaml
        run: uv run --with pyyaml python default_agents/render_compose.py --check

      # The released stack, which installed CLIs run, is generated from
      # docker-compose.yml. Fail if their sources diverged.
      - name: Check docker-compose.release.yml is in sync
        run: uv run --with pyyaml python default_agents/render_release.py --check

      - name: Check service security and release image inventory
        run: uv run --with pytest --with pyyaml python -m pytest default_agents/tests/test_compose_in_sync.py

      # The published frontend image compiles this projection, so it must match
      # what the backend schema and the CLI produce for a default configuration.
      - name: Check the published frontend projection is in sync
        working-directory: backend
        run: uv run --frozen --no-env-file python ../packaging/frontend/render_public_config.py --check


  frontend-ci:
    name: Frontend CI (Next.js / React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.19
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests with Vitest
        run: npm run test


  mcp-ci:
    name: MCP CI (local adapter)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "mcp-uv"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MCP dependencies
        run: uv sync --project MCP --frozen

      - name: Run MCP Tests
        run: uv run --project MCP --frozen --no-env-file pytest MCP/tests


  functional-ci:
    name: Functional Regression CI (Docker Stack + Mock LLM)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, default-agents-ci, mcp-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "functional-uv"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20.19
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Backend Test Runner Dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      # The stack is configured through JSON, so CI writes the CI runtime
      # directory it owns and starts Compose through the CLI. No dotenv file and
      # no duplicated per-service projections.
      - name: Prepare CI Runtime Configuration
        run: |
          CI_HOME="$RUNNER_TEMP/hybro-ci"
          mkdir -p "$CI_HOME"
          chmod 700 "$CI_HOME"
          cat > "$CI_HOME/config.json" <<'JSON'
          {
            "version": 1,
            "provider": { "id": "openai", "auth": "api_key" },
            "models": { "text": "gpt-4o-mini" },
            "backend": { "openai_base_url": "http://mock-llm:8080/v1" }
          }
          JSON
          cat > "$CI_HOME/auth.json" <<'JSON'
          {
            "provider": "openai",
            "auth": "api_key",
            "api_key": "mock-api-key-ci"
          }
          JSON
          chmod 600 "$CI_HOME/auth.json"
          echo "HYBRO_HOME=$CI_HOME" >> "$GITHUB_ENV"

      - name: Start Full Hybro Container Stack with Mock LLM
        env:
          # Reuse the environment synced by the step above instead of a new one.
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/backend/.venv
        run: |
          ./scripts/hybro start --build --compose-file docker-compose.ci.yml
          echo "Waiting for backend health check..."
          timeout 180s bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'
          echo "Backend container is healthy and ready!"
          echo "Waiting for agents registration..."
          timeout 90s bash -c 'until curl -sf http://localhost:8000/api/v1/agent/getAllAgents?active_only=true | grep -qi "Travel Planner"; do sleep 2; done'
          echo "Agents successfully registered!"

      - name: Verify default MCP startup and tools
        run: |
          uv run --project MCP --frozen --no-env-file python - <<'PY'
          import asyncio
          import httpx
          from mcp import Client

          async def check():
              async with httpx.AsyncClient(timeout=5) as http:
                  health = await http.get("http://127.0.0.1:8001/health")
                  assert health.json() == {"service": "hybro-mcp", "status": "ready"}
                  panel = await http.get("http://localhost:3000/hybro-mcp")
                  assert panel.json() == health.json()
              async with Client("http://127.0.0.1:8001/mcp") as client:
                  tools = await client.list_tools()
                  assert {tool.name for tool in tools.tools} == {"discover_agents", "send_agent_message"}
                  result = await client.call_tool("discover_agents", {})
                  assert not result.is_error
                  assert result.structured_content["agents"]

          asyncio.run(check())
          PY
          ./scripts/hybro mcp stop
          ./scripts/hybro mcp start
          timeout 30s bash -c 'until ./scripts/hybro mcp status; do sleep 2; done'

      - name: Run Backend Functional Tests Against Live Containers
        working-directory: backend
        env:
          HYBRO_API_URL: http://localhost:8000/api/v1
          HYBRO_FORCE_FUNCTIONAL_TESTS: "1"
        run: uv run pytest tests/functional/ -v --tb=short

      - name: Run Frontend Playwright Functional E2E Against Live Containers
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: npx playwright test tests/e2e/functional-hitl-workflow.spec.ts

      - name: Dump Container Logs on Failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=100

      - name: Tear Down Stack
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
