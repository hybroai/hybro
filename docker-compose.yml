# Shared config for every default agent (see default_agents/agents.yaml).
# Start through hybro: the CLI reads config.json/auth.json and supplies only
# scoped transport values. No dotenv file is a configuration source.
#
# The project name is pinned so a container keeps its identity no matter where
# the CLI is installed or which directory it runs from.
name: hybro

x-agent: &agent
  build:
    context: ./default_agents
    dockerfile: Dockerfile
  restart: always
  depends_on:
    backend:
      condition: service_healthy

services:
  mongo:
    image: mongo:7.0
    command:
      - "--replSet"
      - "rs0"
      - "--bind_ip_all"
      - "--port"
      - "27017"
      - "--quiet"
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongo-setup:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command: >
      mongosh --host mongo:27017 --eval '
      try {
        rs.status();
      } catch(e) {
        rs.initiate({ _id: "rs0", members: [ { _id: 0, host: "mongo:27017" } ] });
      }'


  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Exposes /api/v1/internal/llm on the host. Front production with an ingress
      # that denies that path to non-Agent callers (see System-Architecture).
      - "8000:8000"
    environment:
      - HYBRO_CONTAINER=1
      - HYBRO_HOME=/var/lib/hybro/runtime
      # >>> BEGIN default-agent host ports (generated by default_agents/render_compose.py — do not edit by hand) >>>
      # Every agent below publishes its host port, so discovery over
      # host.docker.internal would find this stack's own agents and register a
      # second copy of each under its host URL.
      - LOCAL_AGENT_DISCOVERY_EXCLUDED_PORTS=7001,6002,7002,7003
      # <<< END default-agent host ports <<<
    volumes:
      - room_files:/var/lib/hybro/files
      # Writable for the shared config/auth snapshot lock; backend only.
      - ${HYBRO_HOME:-${HOME}/.hybro}:/var/lib/hybro/runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else sys.exit(1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: always

  # Host access stays loopback-only; the container uses the private stack network.
  mcp:
    build:
      context: ./MCP
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - HYBRO_MCP_CONFIG=${HYBRO_MCP_CONFIG:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import json,urllib.request,sys; data=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4)); sys.exit(0 if data.get('status') == 'ready' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Server-side rewrites are built into the image, so the build still needs a
      # projection for routing. Browser settings are delivered at runtime below.
      args:
        HYBRO_BACKEND_URL: http://backend:8000
        HYBRO_FRONTEND_CONFIG: ${HYBRO_FRONTEND_CONFIG:-}
    ports:
      - "3000:3000"
    # Server SDK credentials only; never passed as build arguments.
    environment:
      - HYBRO_BACKEND_URL=http://backend:8000
      # Fixed server-to-server status probe only; never proxies MCP tool calls.
      - HYBRO_MCP_URL=http://mcp:8001
      # The public projection the browser reads. It is the same validated
      # projection the build used, supplied per deployment so one image serves
      # every install and settings apply on recreate without a rebuild.
      - HYBRO_FRONTEND_CONFIG=${HYBRO_FRONTEND_CONFIG:-}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET:-}
    depends_on:
      - backend
    restart: always

  # >>> BEGIN default agents (generated by default_agents/render_compose.py — do not edit by hand) >>>
  # ---- Default agents (generated from default_agents/agents.yaml) ----

  weather-agent:
    <<: *agent
    build:
      context: ./default_agents
      dockerfile: Dockerfile
      args:
        AGENT_DIR: weather_agent
    environment:
      - SERVER_PORT=7001
      - SERVER_DOMAIN=weather-agent
      - HYBRO_AGENT_CONFIG=${HYBRO_AGENT_CONFIG:-}
    ports:
      - "7001:7001"

  image-generator-agent:
    <<: *agent
    build:
      context: ./default_agents
      dockerfile: Dockerfile
      args:
        AGENT_DIR: image_generator_agent
    environment:
      - SERVER_PORT=6002
      - SERVER_DOMAIN=image-generator-agent
      - HYBRO_AGENT_CONFIG=${HYBRO_AGENT_CONFIG:-}
    ports:
      - "6002:6002"

  travel-planner-agent:
    <<: *agent
    build:
      context: ./default_agents
      dockerfile: Dockerfile
      args:
        AGENT_DIR: travel_planner_agent
    environment:
      - SERVER_PORT=7002
      - SERVER_DOMAIN=travel-planner-agent
      - HYBRO_AGENT_CONFIG=${HYBRO_AGENT_CONFIG:-}
    ports:
      - "7002:7002"

  story-agent:
    <<: *agent
    build:
      context: ./default_agents
      dockerfile: Dockerfile
      args:
        AGENT_DIR: story_agent
    environment:
      - SERVER_PORT=7003
      - SERVER_DOMAIN=story-agent
      - HYBRO_AGENT_CONFIG=${HYBRO_AGENT_CONFIG:-}
    ports:
      - "7003:7003"

  # One-shot: registers every enabled agent with the backend, then exits.
  # Uses filtered interpolation instead of env_file so backend secrets
  # (Mongo, Clerk, webhook signing key, ...) never reach this container.
  registrar:
    build:
      context: ./default_agents
      dockerfile: Dockerfile.registrar
    environment:
      - BACKEND_URL=http://backend:8000
      - API_PREFIX=${HYBRO_API_PREFIX:-/api/v1}
      - AGENT_REGISTRAR_TOKEN=${AGENT_REGISTRAR_TOKEN:-}
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
      weather-agent:
        condition: service_started
      image-generator-agent:
        condition: service_started
      travel-planner-agent:
        condition: service_started
      story-agent:
        condition: service_started
  # <<< END default agents <<<

volumes:
  mongo_data:
  redis_data:
  room_files:
