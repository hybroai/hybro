# Shared config for every default agent (see default_agents/agents.yaml).
# NOTE: no env_file here — the root .env carries backend/frontend secrets
# (Mongo credentials, WEBHOOK_SIGNING_KEY, CLERK_SECRET_KEY,
# etc.) that default agents must not receive. Each generated agent service
# instead pulls the specific keys it needs via ${VAR:-default} interpolation
# so only agent-relevant values reach the container.
x-agent: &agent
  build:
    context: ./default_agents
    dockerfile: Dockerfile
  restart: always
  depends_on:
    backend:
      condition: service_healthy

services:
  mongo:
    image: mongo:7.0
    command:
      - "--replSet"
      - "rs0"
      - "--bind_ip_all"
      - "--port"
      - "27017"
      - "--quiet"
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongo-setup:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command: >
      mongosh --host mongo:27017 --eval '
      try {
        rs.status();
      } catch(e) {
        rs.initiate({ _id: "rs0", members: [ { _id: 0, host: "mongo:27017" } ] });
      }'


  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
        required: false
    environment:
      - MONGODB_URL=mongodb://mongo:27017/hybro
      - REDIS_URL=redis://redis:6379/0
      - API_PREFIX=/api/v1
      - HYBRO_FILE_DIR=/var/lib/hybro/files
      - LOCAL_AGENT_DISCOVERY_ENABLED=true
      - ORCHESTRATOR_RECOVERY_ENABLED=true
    volumes:
      - room_files:/var/lib/hybro/files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else sys.exit(1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values must be provided at BUILD time or Next.js compiles
      # its code defaults into the browser bundle (routes-manifest.json, client
      # bundles). We forward them here as build args and also re-inject the
      # server-only Clerk secrets at runtime below.
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_PREFIX: ${NEXT_PUBLIC_API_PREFIX:-/api/v1}
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/}
        NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/}
        NEXT_PUBLIC_ENABLE_WAITLIST: ${NEXT_PUBLIC_ENABLE_WAITLIST:-true}
        NEXT_PUBLIC_MAX_MESSAGE_LENGTH: ${NEXT_PUBLIC_MAX_MESSAGE_LENGTH:-10000}
        NEXT_PUBLIC_INSPECTION_TIMEOUT_MS: ${NEXT_PUBLIC_INSPECTION_TIMEOUT_MS:-300000}
    ports:
      - "3000:3000"
    # Intentionally no full env_file: do not inject backend/agent secrets into
    # Next.js. Runtime only needs BACKEND_URL for the API rewrite and the two
    # server-side Clerk secrets. NEXT_PUBLIC_* values are already baked into
    # the image via build args above.
    environment:
      - BACKEND_URL=http://backend:8000
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET:-}
    depends_on:
      - backend
    restart: always

  # >>> BEGIN default agents (generated by default_agents/render_compose.py — do not edit by hand) >>>
  # ---- Default agents (generated from default_agents/agents.yaml) ----

  weather-agent:
    <<: *agent
    build:
      context: ./default_agents
      dockerfile: Dockerfile
      args:
        AGENT_DIR: weather_agent
    environment:
      - SERVER_PORT=7001
      - SERVER_DOMAIN=weather-agent
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - IMAGE_MODEL=${IMAGE_MODEL:-gpt-image-1}
      - IMAGE_SIZE=${IMAGE_SIZE:-1024x1024}
    ports:
      - "7001:7001"

  image-generator-agent:
    <<: *agent
    build:
      context: ./default_agents
      dockerfile: Dockerfile
      args:
        AGENT_DIR: image_generator_agent
    environment:
      - SERVER_PORT=6002
      - SERVER_DOMAIN=image-generator-agent
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - IMAGE_MODEL=${IMAGE_MODEL:-gpt-image-1}
      - IMAGE_SIZE=${IMAGE_SIZE:-1024x1024}
    ports:
      - "6002:6002"

  travel-planner-agent:
    <<: *agent
    build:
      context: ./default_agents
      dockerfile: Dockerfile
      args:
        AGENT_DIR: travel_planner_agent
    environment:
      - SERVER_PORT=7002
      - SERVER_DOMAIN=travel-planner-agent
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - IMAGE_MODEL=${IMAGE_MODEL:-gpt-image-1}
      - IMAGE_SIZE=${IMAGE_SIZE:-1024x1024}
    ports:
      - "7002:7002"

  story-agent:
    <<: *agent
    build:
      context: ./default_agents
      dockerfile: Dockerfile
      args:
        AGENT_DIR: story_agent
    environment:
      - SERVER_PORT=7003
      - SERVER_DOMAIN=story-agent
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - IMAGE_MODEL=${IMAGE_MODEL:-gpt-image-1}
      - IMAGE_SIZE=${IMAGE_SIZE:-1024x1024}
    ports:
      - "7003:7003"

  # One-shot: registers every enabled agent with the backend, then exits.
  # Uses filtered interpolation instead of env_file so backend secrets
  # (Mongo, Clerk, webhook signing key, ...) never reach this container.
  registrar:
    build:
      context: ./default_agents
      dockerfile: Dockerfile.registrar
    environment:
      - BACKEND_URL=http://backend:8000
      - API_PREFIX=/api/v1
      - AGENT_REGISTRAR_TOKEN=${AGENT_REGISTRAR_TOKEN:-}
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
      weather-agent:
        condition: service_started
      image-generator-agent:
        condition: service_started
      travel-planner-agent:
        condition: service_started
      story-agent:
        condition: service_started
  # <<< END default agents <<<

volumes:
  mongo_data:
  redis_data:
  room_files:
