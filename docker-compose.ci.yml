# Docker Compose overlay for CI and automated regression testing.
# Starts a mock OpenAI-compatible LLM service and points backend and agents to it.

services:
  mock-llm:
    image: python:3.12-slim
    command: python -u /scripts/mock_llm_server.py 8080
    volumes:
      - ./scripts/mock_llm_server.py:/scripts/mock_llm_server.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8080/health', timeout=3).status == 200 else sys.exit(1)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    restart: always

  backend:
    environment:
      - OPENAI_BASE_URL=http://mock-llm:8080/v1
      - OPENAI_API_KEY=mock-api-key-ci
      - SUPERVISOR_MODEL=gpt-4o
      - LEAD_AI_MODEL=gpt-4o
      - CLASSIFIER_AI_MODEL=gpt-4o-mini
      - ORCHESTRATOR_FAST_THINKING_LEVEL=
      - ORCHESTRATOR_ULTIMATE_THINKING_LEVEL=
      - DEFAULT_AGENT_REGISTRAR_TOKEN=ci-service-registrar-token
    depends_on:
      mock-llm:
        condition: service_healthy

  weather-agent:
    environment:
      - OPENAI_BASE_URL=http://mock-llm:8080/v1
      - OPENAI_API_KEY=mock-api-key-ci
    depends_on:
      mock-llm:
        condition: service_healthy

  travel-planner-agent:
    environment:
      - OPENAI_BASE_URL=http://mock-llm:8080/v1
      - OPENAI_API_KEY=mock-api-key-ci
    depends_on:
      mock-llm:
        condition: service_healthy

  image-generator-agent:
    environment:
      - OPENAI_BASE_URL=http://mock-llm:8080/v1
      - OPENAI_API_KEY=mock-api-key-ci
    depends_on:
      mock-llm:
        condition: service_healthy

  story-agent:
    environment:
      - OPENAI_BASE_URL=http://mock-llm:8080/v1
      - OPENAI_API_KEY=mock-api-key-ci
    depends_on:
      mock-llm:
        condition: service_healthy

  registrar:
    environment:
      - AGENT_REGISTRAR_TOKEN=ci-service-registrar-token
    depends_on:
      backend:
        condition: service_healthy
